apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pharma
  namespace: argocd
spec:
  description: Dev practice applications
  sourceRepos:
    - https://github.com/your-github-username/zen-gitops.git
  destinations:
    - namespace: dev
      server: https://kubernetes.default.svc
  # Namespace/quota and cluster resources are managed by the bootstrap scripts.
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - group: networking.k8s.io
      kind: Ingress
    - group: ""
      kind: ResourceQuota
