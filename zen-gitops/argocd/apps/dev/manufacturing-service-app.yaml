apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: manufacturing-service
  namespace: argocd
spec:
  project: pharma
  source:
    repoURL: "https://github.com/your-github-username/zen-gitops.git"
    targetRevision: main
    path: manufacturing-service
  destination:
    namespace: dev
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
