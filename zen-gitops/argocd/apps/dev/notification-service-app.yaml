apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-service
  namespace: argocd
spec:
  project: pharma
  source:
    repo: "https://github.com/zenpharma/zen-gitops.git"
    targetRevision: main
    path: notification-service
  destination:
    namespace: dev
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true