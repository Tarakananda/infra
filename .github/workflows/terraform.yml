name: Terraform Infrastructure

# PRs and merges plan only. Start/stop the dev lab explicitly with workflow_dispatch.
on:
  push:
    branches: [main]
    paths: ['env/dev/**', 'modules/**', 'scripts/**', 'tests/**', 'zen-gitops/**', '.github/workflows/terraform.yml']
  pull_request:
    branches: [main]
    paths: ['env/dev/**', 'modules/**', 'scripts/**', 'tests/**', 'zen-gitops/**', '.github/workflows/terraform.yml']
  workflow_dispatch:
    inputs:
      action:
        description: 'Dev practice action'
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]
      confirm_destroy:
        description: 'Type "destroy" to delete the dev lab and its database'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: '1.15.9'
  TF_INPUT: 'false'
  TF_IN_AUTOMATION: 'true'
  AWS_REGION: ap-south-1

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  validate:
    name: Validate dev and scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: env/dev
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Check destroy confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [[ "$CONFIRM_DESTROY" != destroy ]]; then
            echo '::error::Set confirm_destroy to destroy to delete the dev lab.'
            exit 1
          fi
      - name: Check Terraform formatting
        working-directory: .
        run: terraform fmt -check -recursive
      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Terraform Validate
        run: terraform validate -no-color
      - name: Test dev endpoint refresh and capacity checks
        working-directory: .
        run: python3 -m unittest discover -s tests -v

  plan:
    name: Terraform Plan (dev)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
    env:
      TF_VAR_db_password: ${{ secrets.DEV_DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.DEV_JWT_SECRET }}
      TF_VAR_github_org: ${{ vars.GH_ORG || github.repository_owner }}
      TF_VAR_eks_admin_principal_arns: ${{ vars.DEV_EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}
    defaults:
      run:
        working-directory: env/dev
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Check required inputs
        run: |
          if [[ -z "$TF_VAR_db_password" || -z "$TF_VAR_jwt_secret" ]]; then
            echo '::error::Set DEV_DB_PASSWORD and DEV_JWT_SECRET repository secrets.'
            exit 1
          fi
      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly
      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan -no-color
      - name: Check practice capacity
        run: terraform show -json tfplan | python3 ../../scripts/check_practice_plan.py
      - name: Upload reviewed plan
        uses: actions/upload-artifact@v6
        with:
          name: tfplan-dev
          path: env/dev/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform Apply (dev)
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    environment: dev
    defaults:
      run:
        working-directory: env/dev
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly
      - uses: actions/download-artifact@v7
        with:
          name: tfplan-dev
          path: env/dev
      - name: Recheck practice capacity
        run: terraform show -json tfplan | python3 ../../scripts/check_practice_plan.py
      - name: Terraform Apply
        run: terraform apply -input=false -lock-timeout=5m -auto-approve -no-color tfplan
      - name: Refresh runner kubeconfig and publish current endpoints
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name pharma-dev-cluster --alias pharma-dev --user-alias pharma-dev
          {
            echo '### Dev lab endpoints'
            echo "EKS: $(terraform output -raw eks_cluster_endpoint)"
            echo "RDS: $(terraform output -raw rds_endpoint)"
            echo ''
            echo 'On your computer, pull this commit and run: `python3 scripts/connect_dev.py`.'
            echo 'GitHub Actions cannot update the kubeconfig on your computer.'
            echo 'Destroy the lab after practice to stop the EKS/EC2/RDS/NAT hourly charges.'
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Terraform Destroy (dev)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && inputs.confirm_destroy == 'destroy'
    environment: dev
    env:
      TF_VAR_db_password: ${{ secrets.DEV_DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.DEV_JWT_SECRET }}
      TF_VAR_github_org: ${{ vars.GH_ORG || github.repository_owner }}
      TF_VAR_eks_admin_principal_arns: ${{ vars.DEV_EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}
    defaults:
      run:
        working-directory: env/dev
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Check required inputs
        run: |
          if [[ -z "$TF_VAR_db_password" || -z "$TF_VAR_jwt_secret" ]]; then
            echo '::error::Set DEV_DB_PASSWORD and DEV_JWT_SECRET repository secrets.'
            exit 1
          fi
      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly
      - name: Terraform Destroy
        run: terraform destroy -input=false -lock-timeout=5m -auto-approve -no-color
