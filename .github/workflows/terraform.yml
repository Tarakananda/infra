name: Terraform Infrastructure

# PR to main        → plan only
# Push/merge to main → plan (auto) → approval gate → apply
# Manual dispatch    → plan, apply, or destroy the selected environment

on:
  push:
    branches: [main]
    paths:
      - 'env/dev/**'
      - 'env/staging/**'
      - 'env/prod/**'
      - 'modules/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'env/dev/**'
      - 'env/staging/**'
      - 'env/prod/**'
      - 'modules/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, destroy, destroy-staging, destroy-prod]
      target_env:
        description: 'Target environment (dev, staging, prod)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]
      confirm_destroy:
        description: 'Type "destroy" to confirm destruction (required for all destroy actions)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: '1.15.9'
  TF_INPUT: 'false'
  TF_IN_AUTOMATION: 'true'
  AWS_REGION: ap-south-1

# Serialize access to each state across branches. Never cancel an active apply.
concurrency:
  group: terraform-${{ github.event.inputs.action == 'destroy-staging' && 'staging' || github.event.inputs.action == 'destroy-prod' && 'prod' || github.event.inputs.target_env || 'dev' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Terraform Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    defaults:
      run:
        working-directory: env/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate -no-color

  # ── Plan ──────────────────────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'workflow_dispatch' || !startsWith(github.event.inputs.action, 'destroy')
    env:
      TF_VAR_db_password: ${{ secrets[format('{0}_DB_PASSWORD', github.event.inputs.target_env || 'dev')] }}
      TF_VAR_jwt_secret: ${{ secrets[format('{0}_JWT_SECRET', github.event.inputs.target_env || 'dev')] }}
      TF_VAR_github_org: ${{ vars.GH_ORG || github.repository_owner }}
    defaults:
      run:
        working-directory: env/${{ github.event.inputs.target_env || 'dev' }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check required Terraform inputs
        run: |
          if [[ -z "$TF_VAR_db_password" || -z "$TF_VAR_jwt_secret" ]]; then
            echo "::error::Set the selected environment's DB_PASSWORD and JWT_SECRET repository secrets (DEV_, STAGING_, or PROD_ prefix)."
            exit 1
          fi

      - name: Terraform Init
        id: init
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan \
            -no-color

      - name: Upload plan file
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: tfplan-${{ github.event.inputs.target_env || 'dev' }}
          path: env/${{ github.event.inputs.target_env || 'dev' }}/tfplan
          retention-days: 1
          if-no-files-found: error

  # ── Apply ─────────────────────────────────────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment: ${{ github.event.inputs.target_env || 'dev' }}
    defaults:
      run:
        working-directory: env/${{ github.event.inputs.target_env || 'dev' }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      - name: Download plan file
        uses: actions/download-artifact@v7
        with:
          name: tfplan-${{ github.event.inputs.target_env || 'dev' }}
          path: env/${{ github.event.inputs.target_env || 'dev' }}

      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            -no-color \
            tfplan

  # ── Destroy ───────────────────────────────────────────────────────────────
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: validate
    env:
      TF_VAR_db_password: ${{ secrets[format('{0}_DB_PASSWORD', github.event.inputs.target_env || 'dev')] }}
      TF_VAR_jwt_secret: ${{ secrets[format('{0}_JWT_SECRET', github.event.inputs.target_env || 'dev')] }}
      TF_VAR_github_org: ${{ vars.GH_ORG || github.repository_owner }}
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy' &&
      github.event.inputs.confirm_destroy == 'destroy'
    environment: ${{ github.event.inputs.target_env || 'dev' }}
    defaults:
      run:
        working-directory: env/${{ github.event.inputs.target_env || 'dev' }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check required Terraform inputs
        run: |
          if [[ -z "$TF_VAR_db_password" || -z "$TF_VAR_jwt_secret" ]]; then
            echo "::error::Set the selected environment's DB_PASSWORD and JWT_SECRET repository secrets (DEV_, STAGING_, or PROD_ prefix)."
            exit 1
          fi

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            -no-color

  # ── Destroy Staging ──────────────────────────────────────────────────────
  destroy-staging:
    name: Terraform Destroy Staging
    runs-on: ubuntu-latest
    needs: validate
    env:
      TF_VAR_db_password: ${{ secrets.STAGING_DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.STAGING_JWT_SECRET }}
      TF_VAR_github_org: ${{ vars.GH_ORG || github.repository_owner }}
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy-staging' &&
      github.event.inputs.confirm_destroy == 'destroy'
    environment: staging
    defaults:
      run:
        working-directory: env/staging

    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check required Terraform inputs
        run: |
          if [[ -z "$TF_VAR_db_password" || -z "$TF_VAR_jwt_secret" ]]; then
            echo "::error::Set the selected environment's DB_PASSWORD and JWT_SECRET repository secrets (DEV_, STAGING_, or PROD_ prefix)."
            exit 1
          fi

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            -no-color

  # ── Destroy Prod ──────────────────────────────────────────────────────────
  destroy-prod:
    name: Terraform Destroy Prod
    runs-on: ubuntu-latest
    needs: validate
    env:
      TF_VAR_db_password: ${{ secrets.PROD_DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.PROD_JWT_SECRET }}
      TF_VAR_github_org: ${{ vars.GH_ORG || github.repository_owner }}
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy-prod' &&
      github.event.inputs.confirm_destroy == 'destroy'
    environment: prod
    defaults:
      run:
        working-directory: env/prod

    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check required Terraform inputs
        run: |
          if [[ -z "$TF_VAR_db_password" || -z "$TF_VAR_jwt_secret" ]]; then
            echo "::error::Set the selected environment's DB_PASSWORD and JWT_SECRET repository secrets (DEV_, STAGING_, or PROD_ prefix)."
            exit 1
          fi

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            -no-color
